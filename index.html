<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finanzas Personales | Login</title>
    <!-- Tailwind CSS para los estilos -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-900 mb-2">Finanzas P2P</h1>
            <p class="text-gray-500 text-sm">Tu dinero, tus datos, tus reglas.</p>
        </div>

        <!-- Pestañas de Navegación -->
        <div class="flex mb-6 bg-gray-100 rounded-lg p-1">
            <button id="btn-tab-login" class="flex-1 py-2 rounded-md font-medium text-sm transition-all bg-white shadow text-gray-900" onclick="switchTab('login')">
                Iniciar Sesión
            </button>
            <button id="btn-tab-register" class="flex-1 py-2 rounded-md font-medium text-sm transition-all text-gray-500 hover:text-gray-900" onclick="switchTab('register')">
                Registrarse
            </button>
        </div>

        <!-- Formulario de Iniciar Sesión -->
        <form id="login-form" class="space-y-4 block" onsubmit="handleLogin(event)">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Usuario</label>
                <input type="text" id="login-username" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
                <input type="password" id="login-password" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
            <button type="submit" id="login-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition-colors flex justify-center">
                <span>Entrar</span>
            </button>
        </form>

        <!-- Formulario de Registro -->
        <form id="register-form" class="space-y-4 hidden" onsubmit="handleRegister(event)">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Usuario</label>
                <input type="text" id="reg-username" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
                <input type="password" id="reg-password" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Tu API de Google Sheets</label>
                <input type="url" id="reg-apiurl" required placeholder="https://script.google.com/macros/s/.../exec" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                <p class="text-xs text-gray-500 mt-1">Pega la URL de la Web App de tu propia hoja de cálculo.</p>
            </div>
            <button type="submit" id="register-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition-colors flex justify-center">
                <span>Crear Cuenta</span>
            </button>
        </form>

        <!-- Contenedor de Mensajes (Errores o Éxito) -->
        <div id="message-box" class="mt-4 text-center text-sm font-medium hidden rounded p-2"></div>
    </div>

    <script>
        // TU URL MAESTRA (Con el ID que me pasaste)
        const API_MAESTRA = "https://script.google.com/macros/s/AKfycbxcmtbUvpsrliBJPLz7hPvXDr5trFEiCgYum6LUCN5djyuFc2zgBqwlTNYx07IImZey/exec";

        // Función para cambiar entre pestañas
        function switchTab(tab) {
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');
            const btnLogin = document.getElementById('btn-tab-login');
            const btnRegister = document.getElementById('btn-tab-register');
            const messageBox = document.getElementById('message-box');

            messageBox.classList.add('hidden'); // Ocultar mensajes al cambiar

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                loginForm.classList.add('block');
                registerForm.classList.remove('block');
                registerForm.classList.add('hidden');
                
                btnLogin.className = "flex-1 py-2 rounded-md font-medium text-sm transition-all bg-white shadow text-gray-900";
                btnRegister.className = "flex-1 py-2 rounded-md font-medium text-sm transition-all text-gray-500 hover:text-gray-900";
            } else {
                registerForm.classList.remove('hidden');
                registerForm.classList.add('block');
                loginForm.classList.remove('block');
                loginForm.classList.add('hidden');

                btnRegister.className = "flex-1 py-2 rounded-md font-medium text-sm transition-all bg-white shadow text-gray-900";
                btnLogin.className = "flex-1 py-2 rounded-md font-medium text-sm transition-all text-gray-500 hover:text-gray-900";
            }
        }

        // Función auxiliar para mostrar mensajes
        function showMessage(text, isError = false) {
            const box = document.getElementById('message-box');
            box.textContent = text;
            box.classList.remove('hidden', 'bg-red-100', 'text-red-700', 'bg-green-100', 'text-green-700');
            
            if (isError) {
                box.classList.add('bg-red-100', 'text-red-700');
            } else {
                box.classList.add('bg-green-100', 'text-green-700');
            }
        }

        // Función para enviar la petición a Apps Script
        async function fetchAppScript(payload, buttonId) {
            const btn = document.getElementById(buttonId);
            const originalText = btn.innerHTML;
            btn.innerHTML = `Cargando...`;
            btn.disabled = true;
            btn.classList.add('opacity-75', 'cursor-not-allowed');

            try {
                // Usamos text/plain para evitar el error de preflight CORS en Apps Script
                const response = await fetch(API_MAESTRA, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });
                
                const data = await response.json();
                return data;
            } catch (error) {
                console.error(error);
                return { success: false, message: "Error de conexión con el servidor." };
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
                btn.classList.remove('opacity-75', 'cursor-not-allowed');
            }
        }

        // Iniciar Sesión
        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;

            const res = await fetchAppScript({ action: 'login', username, password }, 'login-btn');
            
            if (res.success) {
                showMessage("Acceso correcto. Redirigiendo...");
                // Guardamos la API personal del usuario en el navegador
                localStorage.setItem('user_api', res.apiUrl);
                localStorage.setItem('username', username);
                
                // Redirigir al dashboard (Lo crearemos a continuación)
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1000);
            } else {
                showMessage(res.message, true);
            }
        }

        // Registrarse
        async function handleRegister(e) {
            e.preventDefault();
            const username = document.getElementById('reg-username').value;
            const password = document.getElementById('reg-password').value;
            const apiUrl = document.getElementById('reg-apiurl').value;

            const res = await fetchAppScript({ action: 'register', username, password, apiUrl }, 'register-btn');
            
            if (res.success) {
                showMessage("Cuenta creada exitosamente. Inicia sesión.");
                setTimeout(() => {
                    document.getElementById('register-form').reset();
                    switchTab('login');
                }, 1500);
            } else {
                showMessage(res.message || "Error al registrar", true);
            }
        }
    </script>
</body>
</html>
